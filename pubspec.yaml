name: usta
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  file_picker: ^10.3.7
  lottie: ^3.3.2
  smooth_page_indicator: ^1.2.1
  google_fonts: ^6.3.2
  animate_do: ^4.2.0
  flutter_otp_text_field: ^1.5.1+1
  flutter_localizations:
    sdk: flutter
  simple_splash_view: ^0.1.21
  image_picker: ^1.2.1
  camera: ^0.11.1
  iconly: ^1.0.1
  fl_chart: ^1.1.1
  flip_card: ^0.7.0
  flutter_credit_card: ^4.1.0
  dio: ^5.7.0
  pretty_dio_logger: ^1.3.1
  url_launcher: ^6.3.1
  socket_io_client: ^2.0.3
  collection: ^1.18.0
  record: ^6.1.2
  just_audio: ^0.9.35
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  gallery_saver:
    path: third_party/gallery_saver
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  get_storage: ^2.1.1
  flutter_secure_storage: ^10.0.0
  android_id: ^0.4.0
  device_info_plus: ^11.5.0
  uuid: ^4.4.0
  cached_network_image: ^3.4.1
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  image: ^4.1.7
  google_mlkit_face_detection: ^0.13.2
  geocoding: ^2.2.0
  shimmer: ^3.0.0
  googleapis_auth: ^2.0.0
  flutter_local_notifications: ^19.5.0
  connectivity_plus: ^6.1.0
  flutter_image_compress: ^2.4.0


dependency_overrides:
  http: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/notification_key/usta-89a20-d2cbd81d001b.json
  fonts:
    - family: IconBroken
      fonts:
        - asset: assets/fonts/icons.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 600

simple_splash_view:
  lottie: assets/lottie/logo_animation.json
  lottie_dark: assets/lottie/logo_animation_light.json
  # image: assets/images/logo_splash.png
  # image_dark: assets/images/logo_splash.png
  # sound: assets/audio/intro.mp3
  text: "Built by USTA"
  background_color: "#FFFFFF"
  background_color_dark: "#000000"
  text_color: "#000000"
  text_color_dark: "#FFFFFF"
  indicator: false
  text_position: bottom
  duration: 3200
  theme:
    mode: system
    app_theme: "Theme.App"
    splash_theme: "Theme.Splash"
